# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# OpenSSF Best Practices compliance gate — blocks PRs and pushes that lack
# required files or still contain unfilled placeholder tokens.
name: OpenSSF Compliance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  openssf-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check SECURITY.md exists and has substance
        run: |
          SECFILE=""
          [ -f "SECURITY.md" ] && SECFILE="SECURITY.md"
          [ -f "SECURITY.adoc" ] && SECFILE="SECURITY.adoc"
          [ -f ".github/SECURITY.md" ] && SECFILE=".github/SECURITY.md"

          if [ -z "$SECFILE" ]; then
            echo "::error::SECURITY.md (or SECURITY.adoc) is required for OpenSSF Best Practices"
            exit 1
          fi

          LINES=$(wc -l < "$SECFILE")
          if [ "$LINES" -lt 10 ]; then
            echo "::error::$SECFILE has only $LINES lines — must have >10 lines of substantive content"
            exit 1
          fi
          echo "SECURITY file: OK ($SECFILE, $LINES lines)"
      - name: Check LICENSE exists
        run: |
          if [ ! -f "LICENSE" ] && [ ! -f "LICENSE.txt" ] && [ ! -f "LICENSE.md" ]; then
            echo "::error::LICENSE file is required for OpenSSF Best Practices"
            exit 1
          fi
          echo "LICENSE: OK"
      - name: Check CONTRIBUTING exists
        run: |
          if [ ! -f "CONTRIBUTING.md" ] && [ ! -f "CONTRIBUTING.adoc" ] \
             && [ ! -f ".github/CONTRIBUTING.md" ] && [ ! -f ".github/CONTRIBUTING.adoc" ]; then
            echo "::error::CONTRIBUTING file is required for OpenSSF Best Practices"
            exit 1
          fi
          echo "CONTRIBUTING: OK"
      - name: Check README exists
        run: |
          if [ ! -f "README.md" ] && [ ! -f "README.adoc" ] && [ ! -f "README.rst" ] && [ ! -f "README.txt" ] && [ ! -f "README" ]; then
            echo "::error::README file is required for OpenSSF Best Practices"
            exit 1
          fi
          echo "README: OK"
      - name: Check .machine_readable directory and STATE.a2ml
        run: |
          if [ ! -d ".machine_readable" ]; then
            echo "::error::.machine_readable/ directory is required"
            exit 1
          fi

          if [ ! -f ".machine_readable/descriptiles/STATE.a2ml" ]; then
            echo "::error::.machine_readable/descriptiles/STATE.a2ml is required"
            exit 1
          fi
          echo ".machine_readable/descriptiles/STATE.a2ml: OK"
      - name: Check CHANGELOG exists
        run: |
          if [ ! -f "CHANGELOG.md" ] && [ ! -f "CHANGELOG.adoc" ] && [ ! -f "CHANGES.md" ]; then
            echo "::error::CHANGELOG.md is required for OpenSSF Best Practices"
            exit 1
          fi
          echo "CHANGELOG: OK"
      # ─── The whole-tree placeholder gate ────────────────────────────────────
      #
      # This step used to check a HAND-LISTED set of ~13 files with an inline
      # grep. That is the specific split scripts/check-no-placeholders.sh exists
      # to end, in the words of its own header: "the previous split — a workflow
      # that checked a hand-listed set of files, and an e2e test that
      # re-implemented substitution with its own token list — let the two drift
      # until the test passed while real instantiation leaked."
      #
      # It is not hypothetical here. This gate was GREEN while roughly 120 files
      # in the tree carried unfilled tokens (issue #8), because the list covered
      # only the files someone had already filled by hand to get CI passing.
      # STATE.a2ml, ECOSYSTEM.a2ml and SECURITY.md were rendered; ANCHOR.a2ml,
      # CITATION.cff, .github/settings.yml, the whole of container/, most of
      # docs/ and every bot directive were not, and nothing looked at them.
      # A gate that checks a list someone must remember to extend reports
      # coverage while changing no outcome.
      #
      # So it now calls the canonical script, which scans EVERY text file and
      # allow-lists the few legitimate carriers. One implementation, called from
      # here and from tests/e2e/template_instantiation_test.sh, so the two
      # cannot drift apart again.
      - name: Check no unfilled placeholder tokens (whole tree)
        run: |
          if [ ! -f scripts/check-no-placeholders.sh ]; then
            echo "::error::scripts/check-no-placeholders.sh is missing — the placeholder gate cannot run"
            exit 1
          fi
          bash scripts/check-no-placeholders.sh . || {
            echo ""
            echo "::error::unfilled placeholder tokens remain. Fix by editing"
            echo "::error::.machine_readable/configs/instantiation.a2ml and running 'just init'"
            echo "::error::(scripts/instantiate.sh) — not by hand-editing the rendered files."
            exit 1
          }
      # ─── And that the rendered state is reproducible ────────────────────────
      #
      # The gate above proves no token SURVIVES. This proves the values that
      # replaced them are the committed ones, so a hand edit that happens to
      # remove a token cannot pass. --check re-renders from
      # .machine_readable/configs/instantiation.a2ml into a scratch copy and
      # compares; it writes nothing.
      - name: Check the tree is rendered from the committed values
        run: |
          if [ ! -f scripts/instantiate.sh ]; then
            echo "::warning::scripts/instantiate.sh is missing — skipping the reproducibility check"
            exit 0
          fi
          bash scripts/instantiate.sh --check || {
            echo ""
            echo "::error::the tree does not match .machine_readable/configs/instantiation.a2ml."
            echo "::error::Run 'just init' to re-render, or update the manifest if a value changed."
            exit 1
          }
      - name: Verify Hermeneia contractile tridents and manifests
        run: bash scripts/verify-contractiles.sh
      - name: Verify Coaptation extracts all six contractile clause sets
        run: |
          set -euo pipefail
          bash .machine_readable/coaptation/extract-clauses.sh .machine_readable/contractiles \
            | jq -e '(.clauses | length > 0) and (([.clauses[].verb] | unique | length) == 6) and (any(.clauses[]; .verb == "intend" and .is_wish)) and (all(.clauses[]; (.description | length) > 0)) and ((.provenance | keys | length) == 6)' >/dev/null
      - name: Summary
        run: |
          echo "=== OpenSSF Best Practices Compliance: PASS ==="
          echo "All required files present and placeholder-free."
