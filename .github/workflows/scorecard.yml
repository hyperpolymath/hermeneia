# This workflow is managed by gh actions-lock.
name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  scorecard:
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@857ff096af11451841fb10488fed1438523973a1
    # Reusable called-workflow permissions are CAPPED by the caller's grants;
    # without security-events: write here the scorecard SARIF upload fails with
    # startup_failure (hypatia WF018). id-token: write enables OIDC publish.
    permissions:
      contents: read
      security-events: write
      id-token: write
    # NO timeout-minutes HERE. A job whose `uses:` calls a REUSABLE WORKFLOW may
    # only declare uses/with/secrets/permissions/if/concurrency/name/strategy.
    # timeout-minutes is a step-job key: GitHub rejects the job before creating
    # ANY job, so the run is `failure` with zero jobs, zero logs and zero check
    # runs — nothing to debug from. This workflow was dead that way. The called
    # workflow sets its own per-job timeouts. Enforced estate-wide by
    # hyperpolymath/standards tools/policy/check-workflows-parse.sh.
