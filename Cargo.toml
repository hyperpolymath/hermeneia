#
# The Hermeneia workspace.
#
# DELIBERATELY DEPENDENCY-FREE (std only, hand-written JSON), mirroring the
# decision taken in trope-checker/src/rust: it builds offline with no crates.io
# access, so CI cannot fail for reasons unrelated to the language.

[workspace]
resolver = "2"
members = [
    "src/hermeneia-ir",
    "src/hermeneia-syntax",
    "src/hermeneia-store",
    "src/hermeneia-core",
    "src/hermeneia-cli",
]

# The slice workflow checks trope-checker out to `.trope-checker/` so it can
# build the reference checker to test against. That path is INSIDE this
# workspace, so without an exclusion cargo walks up from
# `.trope-checker/src/rust/Cargo.toml`, finds this manifest, sees a package that
# is not a member, and refuses:
#
#   error: current package believes it's in a workspace when it's not
#
# Excluding the whole checkout (not just `src/rust`) keeps any future manifest
# in that tree out too. Nothing here should ever be a member: it is another
# repository, vendored transiently by CI and never committed.
exclude = [".trope-checker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/hyperpolymath/hermeneia"

[profile.release]
opt-level = 3
