# SPDX-License-Identifier: MPL-2.0
# Pre-commit hooks for hyperpolymath RSR repos.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # --- Standard hooks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # --- A2ML manifest validation ---
  - repo: https://github.com/hyperpolymath/a2ml-pre-commit
    rev: main
    hooks:
      - id: validate-a2ml
        name: Validate A2ML manifests

  # --- K9 contract validation ---
  - repo: https://github.com/hyperpolymath/k9-pre-commit
    rev: main
    hooks:
      - id: validate-k9
        name: Validate K9 contracts

  # --- Shell linting ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.2.1
    hooks:
      - id: editorconfig-checker
        exclude: '(\.git|node_modules|target|_build|deps|\.deno|external_corpora|\.lake)/'

  # --- Secret detection ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # --- Arrival pack drift: CLAUDE.md must stay in sync with a2ml ---
  - repo: local
    hooks:
      - id: validate-claude-md
        name: CLAUDE.md arrival pack in sync with a2ml
        entry: bash .machine_readable/arrival-pack/verify.sh
        language: system
        pass_filenames: false
        files: '^(\.machine_readable/descriptiles/.*|CLAUDE\.md)$'

      # --- Coaptation identity: the receipt must name THIS repository (issue #11) ---
      #
      # Runs on every commit and needs NO toolchain, which is the whole point.
      # Issue #11 re-pointed the coaptation identity from the scaffold's name to
      # hermeneia's; this is the executable form of its acceptance criterion, so
      # that re-pointing cannot silently revert on a re-scaffold or a bad merge.
      #
      # Deliberately NOT paired with a `validate-coapt` hook here, even though
      # the arrival-pack drift hook above is nickel-dependent and sets the
      # precedent: the drift gate re-evaluates the comparator, so it needs
      # nickel, and a hook that fails on every commit for a contributor without
      # it teaches people to pass --no-verify. Drift is enforced in CI, where
      # nickel is provisioned; identity is enforced here, where it is free.
      - id: check-coapt-identity
        name: Coaptation receipt declares this repository's identity
        entry: bash .machine_readable/coaptation/check-identity.sh
        language: system
        pass_filenames: false
        files: '^(\.machine_readable/(coaptation/.*|descriptiles/CLADE\.a2ml))$'
